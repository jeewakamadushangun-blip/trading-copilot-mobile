name: Automatic Market Scanner Alerts

on:
  schedule:
    # Runs hourly ONLY during London Open & London/NY Overlap (Mon-Fri)
    # UTC: 07:00-10:00 & 12:00-16:00 (12:30 PM-3:30 PM & 5:30 PM-9:30 PM Sri Lankan Time)
    - cron: '0 7-10,12-16 * * 1-5'
  workflow_dispatch: # Allows manual one-click testing anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests google-genai

      - name: Run Market Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scanner.py
